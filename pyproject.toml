[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drc-agent"
version = "0.1.0"
description = "Physics-grounded multi-region DRC repair research runtime"
requires-python = "==3.12.*"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
  "libcst>=1.4",
  "networkx>=3.3",
  "numpy>=1.26,<2",
  "ortools>=9.10,<9.11",
  "pydantic>=2.8,<3",
  "protobuf>=5.26.1,<6",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<8"]

[project.scripts]
drc-agent = "drc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drc_agent" = ["**/*.so"]

[tool.pytest.ini_options]
markers = ["eda: Docker and KLayout integration tests"]
testpaths = ["tests"]
addopts = "-q"
